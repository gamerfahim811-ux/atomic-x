<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ATOMIC X - Admin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #19002f, #5200b8, #24005c);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: linear-gradient(135deg,#5b00ff,#a62dff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #5511d8;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 17px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #7124ff;
      box-shadow: 0 0 0 3px rgba(113,36,255,.1);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg,#5b00ff,#982dff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #651cff;
      text-decoration: none;
      font-size: 14px;
    }

    .security {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f5f1ff;
      color: #5d27a8;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      AX
    </div>

    <h1>ATOMIC X</h1>

    <div class="subtitle">
      Admin Panel
    </div>

    <form id="loginForm">

      <label>Admin Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">
        LOGIN TO ADMIN
      </button>

    </form>

    <a href="index.html" class="back">
      ← Back to Website
    </a>

    <div class="security">
      🔒 Admin access should be connected to a secure server.
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {

      e.preventDefault();

      alert(
        "Admin login system এখনো সেটআপ করা হয়নি।\n\n" +
        "পরের ধাপে আমরা secure Admin Dashboard তৈরি করব।"
      );

    });
  </script>

</body>
</html>
